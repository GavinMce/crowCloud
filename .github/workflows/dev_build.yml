name: Dev Build

# Manual, on-demand image build for iterating against a live fleet without
# cutting a real release -- cd_publish.yml only triggers on `v*.*.*` tags,
# which is far too slow a loop for testing changes against real hardware
# (crow-operator especially, see docs/development.md). Pushes to GHCR
# under the triggering commit's short SHA (a stable, unique tag -- not a
# floating one) so `helm upgrade --set <component>.tag=<sha>` on the fleet
# side always pulls the exact build being tested, with no imagePullPolicy
# caching ambiguity the way reusing `latest`/`dev` repeatedly would have.
on:
  workflow_dispatch:
    inputs:
      component:
        description: "Which image to build and push"
        required: true
        type: choice
        options:
          - crow-operator
          - crow-api
          - crow-frontend
          - all
        default: crow-operator

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Docker — ${{ matrix.bin }}
    if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == matrix.bin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bin: crow-api
            dockerfile: docker/Dockerfile.api
            helm_key: api
          - bin: crow-operator
            dockerfile: docker/Dockerfile.operator
            helm_key: operator
          - bin: crow-frontend
            dockerfile: docker/Dockerfile.frontend
            helm_key: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.bin }}
          tags: |
            type=sha,format=short,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.bin }}
          cache-to: type=gha,scope=${{ matrix.bin }},mode=max

      - name: Print the helm upgrade command for this build
        run: |
          SHA_TAG="${{ steps.meta.outputs.version }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "### ${{ matrix.bin }} pushed as \`${SHA_TAG}\`"
            echo ""
            echo "Run wherever you have access to the fleet's cluster. Check the"
            echo "currently-installed chart version first (\`helm list -n crow-system\`)"
            echo "and pass it as \`--version\` so only the image tag changes:"
            echo '```bash'
            echo "helm upgrade crowcloud oci://ghcr.io/${OWNER}/charts/crowcloud \\"
            echo "  --version <currently-installed chart version> \\"
            echo "  --reuse-values --set ${{ matrix.helm_key }}.tag=${SHA_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
