apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "crowcloud.fullname" . }}-operator
  labels:
    {{- include "crowcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  # Self-installs the VirtualMachine CRD at startup via server-side apply
  # (crates/crow-operator/src/main.rs::install_crds).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "create", "patch"]
  # Self-creates the fixed crow-resources namespace at startup
  # (crates/crow-operator/src/main.rs::ensure_namespace).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  # Full reconcile loop: watches, provisions/reconciles/deprovisions, and
  # patches status on every CR kind this operator actually installs and
  # reconciles (crates/crow-operator/src/main.rs::install_crds) --
  # confirmed live: ipPool/ipClaim/privateSubnet/exposedEndpoint were all
  # silently 403ing on their own initial list-watch (every one of those
  # controllers was completely non-functional, not just slow) because
  # only virtualmachines was ever granted here.
  - apiGroups: ["crow.cloud"]
    resources:
      - virtualmachines
      - ippools
      - ipclaims
      - privatesubnets
      - exposedendpoints
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["crow.cloud"]
    resources:
      - virtualmachines/status
      - ippools/status
      - ipclaims/status
      - privatesubnets/status
      - exposedendpoints/status
    verbs: ["get", "update", "patch"]
