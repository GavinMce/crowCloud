api:
  # Matches the image published by .github/workflows/cd_publish.yml
  # (ghcr.io/<owner>/crow-api), not "crowcloud-api".
  image: ghcr.io/gavinmce/crow-api
  tag: latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  logLevel: info
  env:
    # Required. e.g. --set api.env.JWT_SECRET=$(openssl rand -hex 32)
    # Templated into a Secret (templates/secret.yaml), never left as a
    # plaintext env value in the Deployment spec.
    JWT_SECRET: ""

    # Only consulted when postgres.enabled is false. When postgres.enabled
    # is true, DATABASE_URL is wired automatically from the CloudNativePG
    # Cluster's generated "app" secret instead.
    DATABASE_URL: ""

    # Alternative to DATABASE_URL above: reference an existing Secret you
    # manage yourself instead of letting this chart create one.
    databaseUrlSecretName: ""
    databaseUrlSecretKey: "database-url"

operator:
  image: ghcr.io/gavinmce/crow-operator
  tag: latest
  imagePullPolicy: IfNotPresent
  logLevel: info
  # Keep at 1 — crow-operator has no leader election and self-installs the
  # VirtualMachine CRD + crow-resources namespace at startup; more than one
  # replica would race on those.
  replicas: 1
  # Optional — the ExposedEndpoint controller degrades to a no-op stub
  # (not a crash) when host is left empty, since most of the operator's
  # functionality (VM provisioning, IP pools) doesn't need VyOS at all.
  # There's exactly one VyOS box per fabric today, so this is operator-
  # level config rather than a per-CR reference.
  vyos:
    host: ""
    sshPort: 22
    sshUser: vyos
    # Physical uplink NIC name on the VyOS box -- DNAT rules are scoped
    # to it so they only match traffic actually arriving from upstream.
    uplinkInterface: ""
    # SSH private key matching the public key baked into the VyOS image
    # (see `crow-cli iso vyos build --ssh-pubkey`). Templated into the
    # shared Secret (templates/secret.yaml), same pattern as JWT_SECRET
    # -- never left as a plaintext Deployment env value.
    sshPrivateKey: ""

postgres:
  # When true, this chart creates a CloudNativePG Cluster resource and wires
  # DATABASE_URL to it automatically. Requires the CloudNativePG operator to
  # already be installed in the cluster (see deploy/bootstrap.sh).
  enabled: true
  storageSize: 10Gi
  storageClass: ""

frontend:
  # Nginx serving the built static assets and reverse-proxying /api/ to the
  # api Service, so the browser sees frontend+API as one origin regardless
  # of whether Ingress is configured.
  image: ghcr.io/gavinmce/crow-frontend
  tag: latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 80
  service:
    # NodePort requires no ingress controller — deploy/bootstrap.sh sets
    # this explicitly so it can print a reachable URL immediately. Leave as
    # ClusterIP if you're fronting this with your own Ingress instead.
    type: ClusterIP
    nodePort: 30080

ingress:
  enabled: false
  host: ""
  ingressClassName: ""
  tls: false
  tlsSecretName: ""
